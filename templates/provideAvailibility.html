<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Availability</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style style="background-color:#e6f7e7;">
        .table-container {
            margin: 30px auto;
            max-width: 900px;
        }
        h1 {
            text-align: center;
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <h1>Hey Doctor, please provide your Availability</h1>

    <div class="table-container">
        <table class="table table-bordered text-center align-middle">
            <thead class="table-light">
                <tr>
                    <th>Date</th>
                    <th>8am - 12pm</th>
                    <th>4pm - 8pm</th>
                </tr>
            </thead>
           <tbody>
    {% for date, times in availibility.items() %}
    <tr>
        <td>{{ date }}</td>
        <td>
            {% if times[0] == 0 %}
            <button class="btn btn-outline-danger" onclick="toggleAvailability(this, '{{ date }}', 0)">Unavailable</button>
            {% else %}
            <button class="btn btn-outline-success active" onclick="toggleAvailability(this, '{{ date }}', 0)">Available</button>
            {% endif %}
        </td>
        <td>
            {% if times[1] == 0 %}
            <button class="btn btn-outline-danger" onclick="toggleAvailability(this, '{{ date }}', 1)">Unavailable</button>
            {% else %}
            <button class="btn btn-outline-success active" onclick="toggleAvailability(this, '{{ date }}', 1)">Available</button>
            {% endif %}
        </td>
    </tr>
    {% endfor %}
</tbody>

        </table>
        <button class="btn btn-outline-success" onclick="updateAvailability()">Update Availability</button>

    </div>
    
    <script>
        let availability  = {{ availibility | tojson }};
        function toggleAvailability(button,date,timeslot) {
            if (button.classList.contains('btn-outline-success')) {
                button.classList.remove('btn-outline-success', 'active');
                button.classList.add('btn-outline-danger');
                button.textContent = 'Unavailable';
                availability                
            } else {
                button.classList.remove('btn-outline-danger');
                button.classList.add('btn-outline-success', 'active');
                button.textContent = 'Available';

            }
            if (availability[date]) {
            availability[date][timeslot] = availability[date][timeslot] === 1 ? 0 : 1;
    }
            console.log(availability);


        }


        function updateAvailability(){
            fetch('/doctor/slots/update', {
            method: 'POST',
            headers: {
            'Content-Type': 'application/json',
            },
            body: JSON.stringify(availability),
        })    .then(response => response.json())
    .then(data => {
        if (data.success) {
            alert('Availability updated successfully!');
        } else {
            alert('Failed to update availability.');
        }
        })
    .catch(error => {
        console.error('Error:', error);
        alert('An error occurred while updating.');
    });
}

    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
</body>
</html>

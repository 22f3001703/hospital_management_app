<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Availability</title>
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .table-container {
            margin: 30px auto;
            max-width: 900px;
        }
        h1 {
            text-align: center;
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <h1>Hey doctor, please provide your Availability</h1>

    <div class="table-container">
        <table class="table table-bordered text-center align-middle">
            <thead class="table-light">
                <tr>
                    <th>Date</th>
                    <th>8am - 12pm</th>
                    <th>4pm - 8pm</th>
                </tr>
            </thead>
            <tbody>
                {% for date, times in availibility.items() %}
                <tr>
                    <td>{{ date.strftime('%A, %d %B %Y') }}</td>
                    <td>
                        <button class="btn {% if times[0] %}btn-outline-success active{% else %}btn-outline-danger{% endif %}" 
                                onclick="toggleAvailability(this)">
                            {% if times[0] %}Available{% else %}Unavailable{% endif %}
                        </button>
                    </td>
                    <td>
                        <button class="btn {% if times[1] %}btn-outline-success active{% else %}btn-outline-danger{% endif %}" 
                                onclick="toggleAvailability(this)">
                            {% if times[1] %}Available{% else %}Unavailable{% endif %}
                        </button>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <!-- Toggle Script -->
    <script>
        function toggleAvailability(button) {
            if (button.classList.contains('btn-outline-success')) {
                // Switch to unavailable
                button.classList.remove('btn-outline-success', 'active');
                button.classList.add('btn-outline-danger');
                button.textContent = 'Unavailable';
            } else {
                // Switch to available
                button.classList.remove('btn-outline-danger');
                button.classList.add('btn-outline-success', 'active');
                button.textContent = 'Available';
            }
        }
    </script>

    <!-- Bootstrap JS (optional, for better support) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

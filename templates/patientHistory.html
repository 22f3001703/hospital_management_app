<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="card mx-auto mt-4" style="max-width: 500px;">
  <div class="card-header text-center">
    Update Patient History
  </div>
  <div class="card-body">
    <h5 class="card-title text-center mb-3">Patient: John Doe</h5>
    <h6 class="card-subtitle mb-2 text-muted text-center">Department: Cardiology</h6>

    <div class="mb-3">
      <label for="diagnosis" class="form-label">Diagnosis</label>
      <textarea class="form-control" id="diagnosis" rows="2" placeholder="Enter diagnosis..."></textarea>
    </div>

    <div class="mb-3">
      <label for="prescription" class="form-label">Prescription</label>
      <textarea class="form-control" id="prescription" rows="2" placeholder="Enter prescription..."></textarea>
    </div>

    <div class="mb-3">
      <label for="medicines" class="form-label">Medicines</label>
      <textarea class="form-control" id="medicines" rows="2" placeholder="List medicines..."></textarea>
    </div>

    <div class="mb-3">
      <label for="notes" class="form-label">Notes</label>
      <textarea class="form-control" id="notes" rows="2" placeholder="Additional notes..."></textarea>
    </div>

    <button class="btn btn-primary w-100" onclick="TosaveTreatment()">Save Treatment</button>
  </div>
  
</div>

    
    
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<Script>
    async function TosaveTreatment(){
        console.log("lauda")
        const diagnosis = document.getElementById("diagnosis").value;
        const prescreption = document.getElementById("prescription").value;
        const medicines = document.getElementById("medicines").value;
        const notes = document.getElementById("notes").value;
        console.log(diagnosis ,prescreption , medicines , notes)
        let formData = new FormData();
        formData.append("diagnosis",diagnosis);
        formData.append("prescription",prescreption)
        formData.append("medicines",medicines)
        formData.append("notes",notes)
        for (let [key, value] of formData.entries()) {
        console.log(key, value);
        }

        const pathname=window.location.pathname;
                const urlsegments = pathname.split('/');
                const username = urlsegments[4];
                const id = urlsegments[5];
                console.log(username,id)

         let response = await fetch(`/dashboard/doctor/patient-history/${username}/${id}`,{
            method:"POST",
            body:formData
         })
         if(response.redirected){
            alert("Updated Succesfully")
                    window.location.href=response.url
                }

       
    } 
</Script>
</html>

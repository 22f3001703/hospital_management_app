<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Department</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar bg-body-tertiary">
  <div class="container-fluid">
    <span class="navbar-text">
  <h1>Hey ,welcome to Department of {{getDetails.name}}</h1>
    </span>
  </div>
</nav>
     <h2 class="text-center my-4">Overview</h2>
     <p class="text-center my-4">{{getDetails.descreption}}</p>

 <div><h2 class="text-center my-4">Doctor's List</h2></div>
 <table>
      <thead>
        <tr>
            <th style="padding-right: 500px;padding-left: 400px;">Doctor's Name</th>
            <th>Action</th>
        </tr>
    </thead>
      <tbody>
        {% for x in getdoctors %}
        <tr>
            <td style="padding-right: 500px;padding-left: 400px;">{{ x.fullname }}</td>
            <td>
            <a class="btn btn-outline-primary" href="/dashboard/patient/dep-details/{{x.specialization}}/{{x.username}}">view details </a>
            </td>
            <td>
            <a class="btn btn-outline-primary" href="/dashboard/patient/{{x.specialization}}/{{x.fullname}}/{{x.username}}/availibility">Check Avaivility</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
 </table>
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</html>

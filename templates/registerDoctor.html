<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Doctor</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #e6f7e7;
        }
        .login-container {
            max-width: 400px;
            margin: 100px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .login-container h2 {
            text-align: center;
            margin-bottom: 30px;
        }
        .form-control {
            border-radius: 10px;
        }
        .btn-primary {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <nav class="navbar bg-body-tertiary">
  <div class="container-fluid text-center">
    <a class="navbar-brand mx-auto " href="#">
      <img src="https://images.pexels.com/photos/164634/pexels-photo-164634.jpeg?_gl=1*1rfblvq*_ga*MTY5NDc0NzA3NC4xNzUzMjk4NzE5*_ga_8JE65Q40S6*czE3NTMyOTg3MTgkbzEkZzEkdDE3NTMyOTg3MjMkajU1JGwwJGgw" width="30" height="24" class="d-inline-block align-text-top" style="align-content: center;">
      Please Register the Doctor Here.
    </a>
  </div>
        </nav>

    <div class="login-container">
        <h2>Register Doctor</h2>
        <form action="/dashboard/admin/register-doctor" method="POST">
            <span style="padding-right: 50px;">
                You are a  :-
                <a class="btn btn-warning">{{session["role"]}}</a>
            </span>
            
       
            <div class="mb-3">
                <label for="fullname" class="form-label"><b>Full Name</b></label>
                <input type="text" class="form-control" id="fullname"  name ="fullname" required ">
            </div>
          
            <div class="mb-3">
                <label for="address" class="form-label"><b>Address</b></label>
                <textarea type="address" class="form-control" id="address" name="address" required ></textarea>
            </div>
            <div class="mb-3">
                    <label for="phone" class="form-label"><b> Phone Number</b></label>
                    <input type="text" class="form-control" id="phone"  name ="phone" required >
                </div>
             <div class="mb-3">
                <label for="email" class="form-label"><b> Email</b></label>
                <input type="email" class="form-control" id="email"  name ="email" required >
            </div>
            <div class="mb-3">
                <label for="experience" class="form-label"><b>Enter your Experience(in breif)</b></label>
                <input type="text" class="form-control" id="experience"  name ="experience" required >
            </div>

            <div class="mb-3">
                <label class="form-label"><b>Department/Specialization</b></label>
                
                <!-- Department choice radio buttons -->
                <div class="mb-2">
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="dept_choice" id="existing_dept" value="existing" checked onchange="toggleDepartmentOptions()">
                        <label class="form-check-label" for="existing_dept">
                            Select from existing departments
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="dept_choice" id="new_dept" value="new" onchange="toggleDepartmentOptions()">
                        <label class="form-check-label" for="new_dept">
                            Add new department
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="dept_choice" id="manual_dept" value="manual" onchange="toggleDepartmentOptions()">
                        <label class="form-check-label" for="manual_dept">
                            Enter manually
                        </label>
                    </div>
                </div>

                <!-- Existing department dropdown -->
                <div id="existing_dept_section" class="mb-3">
                    <select class="form-select" name="existing_specialization" id="existing_specialization">
                        <option value="">Choose a department...</option>
                        {% for dept in departments %}
                            <option value="{{ dept.name }}">{{ dept.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- New department fields -->
                <div id="new_dept_section" class="mb-3" style="display: none;">
                    <div class="mb-2">
                        <input type="text" class="form-control" name="new_dept_name" placeholder="New Department Name">
                    </div>
                    <div class="mb-2">
                        <textarea class="form-control" name="new_dept_description" rows="3" placeholder="Department Description (optional)"></textarea>
                    </div>
                </div>

                <!-- Manual entry field -->
                <div id="manual_dept_section" class="mb-3" style="display: none;">
                    <input type="text" class="form-control" name="manual_specialization" placeholder="Enter specialization/department manually">
                </div>
            </div>
            <div class="mb-3">
                <label for="username" class="form-label"><b>Username</b></label>
                <input type="text" class="form-control" id="username"  name ="username" required >
             <div class="mb-3">
                <label for="password" class="form-label"><b>Password</b></label>
                <input type="password" class="form-control" id="password"  name ="password" required >
            </div>
            <button type="submit" class="btn btn-success" >Create</button>
            <a href="/dashboard/admin" class="btn btn-danger">cancel</a>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function toggleDepartmentOptions() {
            const existingSection = document.getElementById('existing_dept_section');
            const newSection = document.getElementById('new_dept_section');
            const manualSection = document.getElementById('manual_dept_section');
            
            const existingRadio = document.getElementById('existing_dept');
            const newRadio = document.getElementById('new_dept');
            const manualRadio = document.getElementById('manual_dept');
            
            // Hide all sections first
            existingSection.style.display = 'none';
            newSection.style.display = 'none';
            manualSection.style.display = 'none';
            
            // Clear required attributes
            document.getElementById('existing_specialization').removeAttribute('required');
            document.querySelector('input[name="new_dept_name"]').removeAttribute('required');
            document.querySelector('input[name="manual_specialization"]').removeAttribute('required');
            
            // Show appropriate section and set required
            if (existingRadio.checked) {
                existingSection.style.display = 'block';
                document.getElementById('existing_specialization').setAttribute('required', 'required');
            } else if (newRadio.checked) {
                newSection.style.display = 'block';
                document.querySelector('input[name="new_dept_name"]').setAttribute('required', 'required');
            } else if (manualRadio.checked) {
                manualSection.style.display = 'block';
                document.querySelector('input[name="manual_specialization"]').setAttribute('required', 'required');
            }
        }
        
        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            toggleDepartmentOptions();
        });
    </script>

</body>
</html>

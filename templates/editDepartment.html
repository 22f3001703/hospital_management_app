<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Department</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .form-container {
            max-width: 600px;
            margin: 50px auto;
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <nav class="navbar bg-body-tertiary">
        <div class="container-fluid text-center">
            <a class="navbar-brand mx-auto" href="#">
                <img src="https://images.pexels.com/photos/164634/pexels-photo-164634.jpeg?_gl=1*1rfblvq*_ga*MTY5NDc0NzA3NC4xNzUzMjk4NzE5*_ga_8JE65Q40S6*czE3NTMyOTg3MTgkbzEkZzEkdDE3NTMyOTg3MjMkajU1JGwwJGgw" width="30" height="24" class="d-inline-block align-text-top">
                Edit Department
            </a>
        </div>
    </nav>

    <div class="form-container">
        <h2 class="text-center mb-4">Edit Department</h2>
        <form action="/dashboard/admin/departments/edit/{{ department.id }}" method="POST">
            <div class="mb-3">
                <span style="padding-right: 50px;">
                    You are a: <a class="btn btn-warning btn-sm">{{ session["role"] }}</a>
                </span>
            </div>

            <div class="mb-3">
                <label for="name" class="form-label"><b>Department Name</b></label>
                <input type="text" class="form-control" id="name" name="name" value="{{ department.name }}" required>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label"><b>Department Description</b></label>
                <textarea class="form-control" id="description" name="description" rows="4">{{ department.descreption }}</textarea>
            </div>

            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                <button type="submit" class="btn btn-success me-md-2">Update Department</button>
                <a href="/dashboard/admin/departments" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

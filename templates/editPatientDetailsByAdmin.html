<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Patient Details</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-header">
            <h4 class="mb-0">Edit Patient Details (Admin)</h4>
        </div>

        <div class="card-body">
            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="name" class="form-control"
                           value="{{ patient.name }}" required>
                </div>

                
                <div class="mb-3">
                    <label class="form-label">Date of Birth</label>
                    <input type="date" name="dob" class="form-control"
                           value="{{ patient.dob }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Phone</label>
                    <input type="text" name="phone" class="form-control"
                           value="{{ patient.phone }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control"
                           value="{{ patient.email }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Address</label>
                    <textarea name="address" class="form-control" rows="3" required>{{ patient.address }}</textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Emergency Contact</label>
                    <input type="text" name="emergencycontact" class="form-control"
                           value="{{ patient.emergencycontact }}" required>
                </div>

                <button type="submit" class="btn btn-primary">Update Details</button>
                <a href="/dashboard/admin" class="btn btn-secondary">Cancel</a>

            </form>
        </div>
    </div>
</div>

</body>
</html>

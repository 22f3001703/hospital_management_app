<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .doctor-card {
            max-width: 500px;
            width: 100%;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
            padding: 2rem;
        }
        .doctor-card h1 {
            font-size: 1.8rem;
            color: #0d6efd;
        }
        .doctor-card h2 {
            font-size: 1.3rem;
            color: #6c757d;
            margin-bottom: 1rem;
        }
        .doctor-card h3, .doctor-card h4 {
            font-size: 1rem;
            margin: 0.5rem 0;
            color: #343a40;
        }
        .doctor-card .btn {
            width: 48%;
        }
    </style>
</head>
<body>
    <div class="container text-center">
        <h1>Doctor Details</h1>
        <div class="doctor-card mx-auto text-start">
        <h1>{{getDoctorDetails.fullname}}</h1>
        <h2>{{getDoctorDetails.specialization}}</h2>
         <h3><strong>Email:</strong> {{getDoctorDetails.email}}</h3>
            <h3><strong>Phone:</strong> {{getDoctorDetails.phone}}</h3>
            <h3><strong>Address:</strong> {{getDoctorDetails.address}}</h3>
            <h4><strong>Experience:</strong> {{getDoctorDetails.experience}}</h4>
           <div class="d-flex justify-content-between mt-4">
                <a class="btn btn-outline-info" href="/dashboard/patient/{{getDoctorDetails.specialization}}/{{getDoctorDetails.fullname}}/{{getDoctorDetails.username}}/availibility">See Availability</a>
                <a class="btn btn-outline-secondary" href="/dashboard/patient/dep-details/{{getDoctorDetails.specialization}}">Back</a>
            </div>
        </div>
    </div>
</body>

</html>
